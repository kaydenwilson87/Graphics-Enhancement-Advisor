name: Release APK

# Push a tag such as v0.1.0 to build the app and attach the APK to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/debug/app-debug.apk "graphics-advisor-${GITHUB_REF_NAME}.apk"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: graphics-advisor-${{ github.ref_name }}.apk
          generate_release_notes: true
